site_name: Tossling
site_description: One clipboard for your computers and phones, through your own server.
site_url: https://tossling.github.io/docs/
repo_url: https://github.com/Tossling/docs
repo_name: Tossling/docs
edit_uri: edit/main/docs/
copyright: Tossling is free software under GPL-3.0

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Install: install.md
  - Rooms and devices: rooms.md
  - Sending files and everyday use: everyday-use.md
  - Your server:
      - server/index.md
      - Reverse proxy: server/reverse-proxy.md
      - Configuration: server/configuration.md
      - Web panel: server/web-panel.md
      - Projects: server/projects.md
      - Instant delivery: server/instant-delivery.md
      - Changing the domain: server/domain.md
      - Upgrades and backups: server/upgrades.md
  - Security and the protocol:
      - security/index.md
      - Protocol: security/protocol.md
